<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FFT Pre-Computer</title>
</head>
<body>
    <h2>FFT Pre-Computer</h2>
    <p>Generates <code>fft-data.json</code> for the visualizer. Requires internet (loads fft.js from CDN).</p>
    <br>

    <label>Audio file (MP3 / OGG / WAV / M4A):
        <input type="file" id="fileInput" accept="audio/*" />
    </label><br><br>

    <label>intervalMs: <input type="number" id="intervalMs" value="50" min="10" max="500" step="10" /></label>
    &nbsp;(frame stride; 50 ms = 20 fps)<br><br>

    <label>numBars: <input type="number" id="numBars" value="15" min="1" max="64" /></label>
    &nbsp;(must match <code>gameSettings.visualizer.numBars</code>)<br><br>

    <label>fftSize: <input type="number" id="fftSize" value="2048" min="512" max="16384" step="512" /></label>
    &nbsp;(power of 2; 2048 recommended)<br><br>

    <label>freqMin: <input type="number" id="freqMin" value="5" min="1" max="200" step="1" /></label>
    &nbsp;Hz &mdash; lower = more leading silence on the bass end<br><br>

    <label>freqMax: <input type="number" id="freqMax" value="20000" min="1000" max="22000" step="500" /></label>
    &nbsp;Hz<br><br>

    <button id="btn">Generate fft-data.json</button>
    &nbsp;<span id="status"></span>
    <p id="error" style="color:red; display:none"></p>

<script type="module">
import FFT from 'https://cdn.jsdelivr.net/npm/fft.js/+esm';

function yieldToUI() { return new Promise(r => setTimeout(r, 0)); }

function setStatus(label) {
    document.getElementById('status').textContent = label;
}

function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
}

function buildHannWindow(N) {
    const w = new Float64Array(N);
    for (let n = 0; n < N; n++)
        w[n] = 0.5 * (1 - Math.cos(2 * Math.PI * n / (N - 1)));
    return w;
}

function buildLogBinRanges(numBars, fftSize, sampleRate, freqMin = 20, freqMax = 20000) {
    const nyquist = fftSize / 2;
    return Array.from({ length: numBars }, (_, b) => {
        const fLow  = freqMin * Math.pow(freqMax / freqMin,  b      / numBars);
        const fHigh = freqMin * Math.pow(freqMax / freqMin, (b + 1) / numBars);
        const kLow  = Math.max(0,           Math.floor(fLow  * fftSize / sampleRate));
        const kHigh = Math.min(nyquist - 1, Math.floor(fHigh * fftSize / sampleRate));
        return { kLow, kHigh: Math.max(kLow, kHigh) };
    });
}

document.getElementById('btn').addEventListener('click', async () => {
    document.getElementById('error').style.display = 'none';
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files.length) { showError('Please select an audio file first.'); return; }

    const intervalMs = parseInt(document.getElementById('intervalMs').value, 10);
    const numBars    = parseInt(document.getElementById('numBars').value, 10);
    const fftSize    = parseInt(document.getElementById('fftSize').value, 10);
    const freqMin    = parseFloat(document.getElementById('freqMin').value);
    const freqMax    = parseFloat(document.getElementById('freqMax').value);

    if ((fftSize & (fftSize - 1)) !== 0) { showError('fftSize must be a power of 2.'); return; }
    if (intervalMs < 10 || numBars < 1 || fftSize < 512) { showError('Invalid settings.'); return; }
    if (freqMin <= 0 || freqMax <= freqMin) { showError('freqMin must be > 0 and freqMax must be > freqMin.'); return; }

    const btn = document.getElementById('btn');
    btn.disabled = true;

    try {
        setStatus('Decoding audio...');
        await yieldToUI();

        const audioCtx    = new AudioContext();
        const audioBuffer = await audioCtx.decodeAudioData(await fileInput.files[0].arrayBuffer());
        await audioCtx.close();

        const samples     = audioBuffer.getChannelData(0);
        const sampleRate  = audioBuffer.sampleRate;
        const durationMs  = Math.round(audioBuffer.duration * 1000);
        const stride      = Math.floor(intervalMs / 1000 * sampleRate);
        const totalFrames = Math.floor(audioBuffer.duration * 1000 / intervalMs);
        const hann        = buildHannWindow(fftSize);
        const ranges      = buildLogBinRanges(numBars, fftSize, sampleRate, freqMin, freqMax);
        const fftLib      = new FFT(fftSize);
        const out         = fftLib.createComplexArray();
        const windowed    = new Float64Array(fftSize);

        // Pass 1: find global max for normalization
        let globalMax = 0;
        for (let fi = 0; fi < totalFrames; fi++) {
            const off = fi * stride;
            for (let i = 0; i < fftSize; i++)
                windowed[i] = (off + i < samples.length ? samples[off + i] : 0) * hann[i];
            fftLib.realTransform(out, windowed);
            for (let k = 0; k < fftSize / 2; k++) {
                const mag = Math.sqrt(out[2*k]*out[2*k] + out[2*k+1]*out[2*k+1]);
                if (mag > globalMax) globalMax = mag;
            }
            if (fi % 100 === 0) {
                setStatus(`Pass 1/2: ${Math.round(fi / totalFrames * 100)}%`);
                await yieldToUI();
            }
        }
        const norm = globalMax > 0 ? globalMax : 1;

        // Pass 2: build frame data
        const frames = [];
        for (let fi = 0; fi < totalFrames; fi++) {
            const off = fi * stride;
            for (let i = 0; i < fftSize; i++)
                windowed[i] = (off + i < samples.length ? samples[off + i] : 0) * hann[i];
            fftLib.realTransform(out, windowed);
            frames.push(ranges.map(({ kLow, kHigh }) => {
                let sum = 0;
                for (let k = kLow; k <= kHigh; k++)
                    sum += Math.sqrt(out[2*k]*out[2*k] + out[2*k+1]*out[2*k+1]);
                return Math.min(255, Math.round(sum / (kHigh - kLow + 1) / norm * 255));
            }));
            if (fi % 50 === 0) {
                setStatus(`Pass 2/2: ${Math.round(fi / totalFrames * 100)}%`);
                await yieldToUI();
            }
        }

        setStatus('Saving...');
        await yieldToUI();

        const blob = new Blob([JSON.stringify({ version: 1, intervalMs, numBars, durationMs, frames })], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        Object.assign(document.createElement('a'), { href: url, download: 'fft-data.json' }).click();
        URL.revokeObjectURL(url);

        setStatus(`Done — ${frames.length} frames, ${(durationMs / 1000).toFixed(1)}s.`);

    } catch (err) {
        showError('Error: ' + err.message);
        console.error(err);
    } finally {
        btn.disabled = false;
    }
});
</script>
</body>
</html>
