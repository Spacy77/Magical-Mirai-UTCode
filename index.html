<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>TextAlive Magical Mirai</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="media"></div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/textalive-app-api/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>

    <script>
        const gameSettings = {
            // API settings for TextAlive player integration
            api: {
                // TextAlive app token
                token: "1O5BTRwWsXT6TfAP",
                // Song URL passed to TextAlive to load the track
                songUrl: "https://piapro.jp/t/PNpQ/20251209170719"
            },

            // Color palette used by UI and game objects
            colors: {
                // Primary accent color (hex number for Phaser shapes)
                primary: 0x0000ff,
                // Hover state color for interactive elements
                primaryHover: 0x0000aa,
                // Main text color (CSS hex string)
                textMain: "#000000",
                // Light text color used on dark backgrounds
                textLight: "#ffffff",
                // Secondary text / accent color (CSS hex)
                textPrimary: "#0000ff"
            },

            // Font configuration for text rendering
            fonts: {
                // Main game font for lyrics and large text
                main: '"Noto Sans JP", sans-serif',
                // UI font for buttons, small labels
                ui: 'sans-serif'
            },

            // Loading spinner visuals
            spinner: {
                // Radius of spinner arc in pixels
                radius: 50,
                // Stroke thickness of the spinner arc
                thickness: 8,
                // Rotation speed applied each frame (radians per update)
                rotationSpeed: 0.1
            },

            // Play button dimensions and typography
            button: {
                // Width of the PLAY button in pixels
                width: 250,
                // Height of the PLAY button in pixels
                height: 80,
                // Font size used for button label (CSS value)
                fontSize: "40px"
            },

            // Catcher (player) configuration
            catcher: {
                // X position of the catcher from the left edge (pixels)
                xPos: 120,
                // Catcher visual width in pixels
                width: 40,
                // Catcher visual height in pixels
                height: 160,
                // Movement speed in pixels per update when pressing keys
                speed: 8,
                // Vertical margin to clamp catcher movement (pixels)
                marginY: 80
            },

            // Lyrics / falling character behaviour
            lyrics: {
                // Time (ms) it takes for a lyric character to fall across the screen
                fallTimeMs: 2400,
                // Horizontal offset from right edge where characters start
                startXOffset: 100,
                // Vertical margin to avoid placing lyrics too close to edges
                marginY: 100,
                // Font size used for lyric characters (CSS value)
                fontSize: "80px",
                // Fraction of fall distance past which characters are destroyed
                destroyOverflowRatio: 0.2,
                // Minimum delay before making the next word far away
                minDelayNewYPos: 500,
                // Minimum delay to make an extended character instead of a normal one
                minDelayLongChar: 500
            },

            // The sliding Y position pointer for spawning characters, with its own movement constraints
            charSpawnYPointer: {
                // Maximum speed at which the spawn Y pointer can move (ratio of screen height per update)
                maxSpeed: 0.05,
                jerk: 0.001 // Maximum random acceleration applied to the spawn Y pointer each update (pixels per update^2)
            }
        };

        const { Player } = TextAliveApp;
        let isTextAliveReady = false;

        class LoadScene extends Phaser.Scene {
            constructor() {
                super("LoadScene");
            }

            create() {
                const cx = this.scale.width / 2;
                const cy = this.scale.height / 2;

                this.spinner = this.add.graphics({ x: cx, y: cy });
                this.spinner.lineStyle(gameSettings.spinner.thickness, gameSettings.colors.primary, 1);
                this.spinner.beginPath();
                this.spinner.arc(0, 0, gameSettings.spinner.radius, 0, Math.PI * 1.5, false);
                this.spinner.strokePath();
            }

            update() {
                this.spinner.rotation += gameSettings.spinner.rotationSpeed;
                
                if (isTextAliveReady) {
                    this.scene.start("TitleScene");
                }
            }
        }

        class TitleScene extends Phaser.Scene {
            constructor() {
                super("TitleScene");
            }

            create() {
                const cx = this.scale.width / 2;
                const cy = this.scale.height / 2;

                const playButtonBg = this.add.rectangle(
                    cx, 
                    cy, 
                    gameSettings.button.width, 
                    gameSettings.button.height, 
                    gameSettings.colors.primary
                );
                playButtonBg.setInteractive({ useHandCursor: true });

                this.add.text(cx, cy, "PLAY", {
                    fontFamily: gameSettings.fonts.ui,
                    fontSize: gameSettings.button.fontSize,
                    color: gameSettings.colors.textLight,
                    fontStyle: "bold"
                }).setOrigin(0.5);

                playButtonBg.on('pointerover', () => {
                    playButtonBg.fillColor = gameSettings.colors.primaryHover;
                });

                playButtonBg.on('pointerout', () => {
                    playButtonBg.fillColor = gameSettings.colors.primary;
                });

                playButtonBg.on('pointerdown', () => {
                    taPlayer.requestPlay();
                    this.scene.start("GameScene");
                });
            }
        }

        class GameScene extends Phaser.Scene {
            constructor() {
                super("GameScene");
            }

            create() {
                this.fallTime = gameSettings.lyrics.fallTimeMs;
                this.catcherX = gameSettings.catcher.xPos;
                this.destroyThreshold = gameSettings.lyrics.destroyOverflowRatio;
                
                this.catcher = this.add.rectangle(
                    this.catcherX, 
                    this.scale.height / 2, 
                    gameSettings.catcher.width, 
                    gameSettings.catcher.height, 
                    gameSettings.colors.primary
                );
                this.physics.add.existing(this.catcher);
                this.catcher.body.setImmovable(true);

                this.charGroup = this.physics.add.group();
                this.physics.add.overlap(this.catcher, this.charGroup, this.catchChar, null, this);

                this.cursors = this.input.keyboard.createCursorKeys();
                this.activeChars = [];
                this.pendingChars = [];
                this.wordYMap = new Map();

                this.charSpawnYPointer = Phaser.Math.Between(
                    gameSettings.lyrics.marginY,
                    this.scale.width - gameSettings.lyrics.marginY
                ); 
                this.charSpawnYPointerAccelleration = Phaser.Math.Between(
                    - gameSettings.charSpawnYPointer.maxSpeed / 2,
                    gameSettings.charSpawnYPointer.maxSpeed / 2
                ); 

                if (taPlayer && taPlayer.video) {
                    this.loadLyrics(taPlayer.video.firstChar);
                }

                this.lastSpawnedChar = null;
                this.fontSizeInt = parseInt(gameSettings.lyrics.fontSize);
                this.minDelayNewYPos = gameSettings.lyrics.minDelayNewYPos;
                this.lastSpawnedCharY = this.scale.height / 2;
                this.minDelayLongChar = gameSettings.lyrics.minDelayLongChar;

                // debug
                this.spawnYPointerDebugRect = this.add.rectangle(
                    this.scene.width - 10, 
                    this.charSpawnYPointer, 
                    10, 
                    10, 
                    gameSettings.colors.primary,
                );
                // TODO : if uncommented, this will break the collision detection for catching chars. Find out why.
                /*
                this.physics.add.existing(this.spawnYPointerDebugRect);
                this.spawnYPointerDebugRect.body.setImmovable(true);
                */
            }

            update() {
                const w = this.scale.width;
                const h = this.scale.height;

                this.handleInput(h);

                if (!taPlayer || !taPlayer.isPlaying) return;

                const time = taPlayer.timer.position;
                const startX = w + gameSettings.lyrics.startXOffset;
                this.updateYPointer(h);
                this.spawnPendingChars(time, startX, w, h);
                this.updateActiveChars(time, startX);
            }

            handleInput(sceneHeight) {
                if (this.cursors.up.isDown) this.catcher.y -= gameSettings.catcher.speed;
                if (this.cursors.down.isDown) this.catcher.y += gameSettings.catcher.speed;

                this.catcher.y = Phaser.Math.Clamp(
                    this.catcher.y,
                    gameSettings.catcher.marginY,
                    sceneHeight - gameSettings.catcher.marginY
                );
            }

            updateYPointer(sceneHeight) {
                // Move the spawn Y pointer with its current accelleration. Change direction if it hits the vertical margins
                this.charSpawnYPointer += sceneHeight * this.charSpawnYPointerAccelleration;
                if (this.charSpawnYPointer < gameSettings.lyrics.marginY || this.charSpawnYPointer > sceneHeight - gameSettings.lyrics.marginY) {
                    this.charSpawnYPointerAccelleration *= -1;
                    this.charSpawnYPointer = Phaser.Math.Clamp(
                        this.charSpawnYPointer,
                        gameSettings.lyrics.marginY,
                        sceneHeight - gameSettings.lyrics.marginY
                    );
                }

                // Randomly adjust the accelleration
                this.charSpawnYPointerAccelleration += Phaser.Math.Between(
                    - gameSettings.charSpawnYPointer.jerk,
                    gameSettings.charSpawnYPointer.jerk
                );


                // Clamp the accelleration to the maximum speed
                this.charSpawnYPointerAccelleration = Phaser.Math.Clamp(
                    this.charSpawnYPointerAccelleration,
                    - gameSettings.charSpawnYPointer.maxSpeed,
                    gameSettings.charSpawnYPointer.maxSpeed
                );

                // Update debug spawn Y pointer position
                this.spawnYPointerDebugRect.y = this.charSpawnYPointer;
            }

            spawnPendingChars(time, startX, sceneWidth, sceneHeight) {
                while (this.pendingChars.length > 0 && this.pendingChars[0].startTime - this.fallTime <= time) {
                    const charData = this.pendingChars.shift();

                    let deltaTime = 0;
                    if (this.lastSpawnedChar) {
                        deltaTime = charData.startTime - this.lastSpawnedChar.startTime;
                    } else {
                        deltaTime = 9999;
                    }

                    if (time > charData.startTime + (this.fallTime * this.destroyThreshold)) {
                        continue;
                    }

                    let yPos;
                    if (this.wordYMap.has(charData.parent)) {
                        yPos = this.wordYMap.get(charData.parent);
                    } else if (deltaTime < this.minDelayNewYPos){
                        yPos = Math.random() < 0.5 ? 
                            this.lastSpawnedCharY - this.fontSizeInt : 
                            this.lastSpawnedCharY + this.fontSizeInt;
                        yPos = Phaser.Math.Clamp(
                            yPos,
                            this.fontSizeInt / 2,
                            sceneHeight - this.fontSizeInt / 2
                        );
                        this.wordYMap.set(charData.parent, yPos);
                    } else {
                        yPos = this.charSpawnYPointer; 
                        this.wordYMap.set(charData.parent, yPos);
                    }

                    if (!this.wordYMap.has(charData.parent)) {
                        this.lastSpawnedCharY = yPos;
                    }

                    const txt = this.add.text(0, 0, charData.text, { 
                        fontFamily: gameSettings.fonts.main,
                        fontSize: gameSettings.lyrics.fontSize,
                        color: gameSettings.colors.textMain,
                        fontStyle: "bold"
                    }).setOrigin(0.5);

                    const duration = charData.endTime - charData.startTime;
                    let strip = null
                    if (duration > this.minDelayLongChar){
                        txt.updateText();
                        strip = this.add.graphics();
                        strip.fillStyle(0x0000ff, 0.3);
                        strip.fillRect(
                            -txt.width / 2 - 10,
                            -txt.height / 2,
                            txt.width + duration,
                            txt.height
                        );

                        this.tweens.add({
                            targets: strip,
                            alpha: 0,
                            duration: this.fallTime,
                            delay: this.fallTime + duration,
                            onStart: () => {
                                const worldX = container.x;
                                const worldY = container.y;

                                container.remove(strip);
                                strip.setPosition(worldX, worldY);
                                this.add.existing(strip);
                            },
                            onUpdate: () => {
                                strip.x -= 5;
                            },
                            onComplete: () => strip.destroy()
                        });
                    }
                    console.log("txt.width:", txt.width)

                    const children = strip ? [strip, txt] : [txt];
                    const container = this.add.container(startX, yPos, children);
                    this.physics.add.existing(container);
                    this.charGroup.add(container);

                    this.activeChars.push({ obj: container, startTime: charData.startTime });
                    this.lastSpawnedChar = charData;
                }
            }

            updateActiveChars(time, startX) {
                for (let i = this.activeChars.length - 1; i >= 0; i--) {
                    const item = this.activeChars[i];
                    const progress = (time - (item.startTime - this.fallTime)) / this.fallTime;

                    item.obj.x = startX - (startX - this.catcherX) * progress;

                    if (progress > 1 + this.destroyThreshold) {
                        item.obj.destroy();
                        this.activeChars.splice(i, 1);
                    }
                }
            }

            catchChar(catcher, charObj) {
                charObj.destroy();
                const idx = this.activeChars.findIndex(l => l.obj === charObj);
                if (idx > -1) this.activeChars.splice(idx, 1);
            }

            loadLyrics(firstChar) {
                this.pendingChars = [];
                this.wordYMap.clear();
                let char = firstChar;
                while (char) {
                    if (char.text.trim().length > 0) {
                        this.pendingChars.push(char);
                    }
                    char = char.next;
                }
            }
        }

        const config = {
            type: Phaser.AUTO,
            parent: "game-container",
            width: window.innerWidth,
            height: window.innerHeight,
            transparent: true,
            physics: { default: "arcade" },
            scene: [LoadScene, TitleScene, GameScene],
            scale: {
                mode: Phaser.Scale.RESIZE,
                autoCenter: Phaser.Scale.CENTER_BOTH
            }
        };

        const game = new Phaser.Game(config);

        const taPlayer = new Player({
            app: { token: gameSettings.api.token },
            mediaElement: document.querySelector("#media"),
        });

        taPlayer.addListener({
            onTimerReady() {
                isTextAliveReady = true;
            }
        });

        taPlayer.createFromSongUrl(gameSettings.api.songUrl);
    </script>
</body>
</html>
